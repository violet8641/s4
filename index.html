<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartech</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #2563eb;
            --light-bg: #f8fafc;
            --border: #e2e8f0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #334155;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 20px;
            background: #e2e8f0;
            border: none;
            border-radius: 6px 6px 0 0;
            font-weight: bold;
            cursor: pointer;
            color: #64748b;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Shop Header */
        .shop-header {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .shop-info h1 { margin: 0 0 5px 0; color: var(--primary); font-size: 24px; }
        .shop-info p { margin: 2px 0; font-size: 13px; color: #64748b; }
        .header-logo { height: 60px; width: auto; object-fit: contain; display: block; }
        
        .estimate-title {
            text-align: center;
            margin-bottom: 15px;
        }
        .estimate-title h2 { margin: 0; font-size: 20px; color: var(--accent); }

        /* Customer Details Form */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            background: var(--light-bg);
            padding: 10px;
            border-radius: 6px;
        }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .form-group input { padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; }

        /* Search Dropdown Section */
        .search-select-section {
            margin-bottom: 20px;
            background: #eff6ff;
            padding: 15px;
            border-radius: 6px;
            border: 1px dashed #bfdbfe;
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }
        .search-select-section label { font-weight: bold; font-size: 13px; color: var(--accent); white-space: nowrap; }
        .search-select-section input { flex-grow: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; }

        /* Custom dropdown for YouTube-style search */
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 4px 4px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 2px;
        }
        .search-dropdown.show {
            display: block;
        }
        .search-dropdown-item {
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #f1f5f9;
        }
        .search-dropdown-item:hover {
            background: #eff6ff;
        }
        .search-dropdown-item img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .search-dropdown-item .item-info {
            display: flex;
            flex-direction: column;
        }
        .search-dropdown-item .item-name {
            font-weight: 500;
            font-size: 14px;
        }
        .search-dropdown-item .item-details {
            font-size: 12px;
            color: #64748b;
        }
        .no-results {
            padding: 10px 15px;
            color: #64748b;
            font-style: italic;
        }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { padding: 8px 5px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { background-color: var(--primary); color: white; font-size: 13px; }
        td input { width: 90%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; }
        
        /* Image dimensions */
        .table-thumb { width: 40px; height: 40px; object-fit: contain; border-radius: 4px; border: 1px solid var(--border); background-color: #fff; }
        
        /* Gap between image and text field */
        .item-cell { display: flex; align-items: center; gap: 18px; }

        /* Actions & Buttons */
        .actions { display: flex; justify-content: flex-end; align-items: center; margin-top: 20px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; }
        .btn:hover { opacity: 0.9; }
        .btn-add { background: #10b981; color: white; }
        .btn-print { background: var(--accent); color: white; }
        .btn-show-all { background: #6366f1; color: white; }
        .btn-delete { background: #ef4444; color: white; }

        /* Catalog Toolbar & Badges */
        .catalog-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--light-bg);
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .badge-in-est {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            margin-top: 4px;
        }

        /* JSON Tab Styles */
        .json-card {
            background: var(--light-bg);
            border-radius: 8px;
            padding: 25px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            text-align: center;
        }
        .json-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0 10px;
            align-items: center;
            justify-content: center;
        }
        .file-label {
            background: var(--accent);
            color: white;
            padding: 14px 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            border: none;
        }
        .file-label:hover {
            background: #1d4ed8;
        }
        .file-input {
            display: none;
        }
        .json-hint {
            color: #64748b;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
        .import-status {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }
        .import-status.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }
        .import-status.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .inventory-summary {
            margin-top: 15px;
            font-size: 14px;
            color: #334155;
        }

        /* Hide repeating border from screen view */
        .print-border {
            display: none;
        }

        /* ---------------------------------------------------- */
        /* MOBILE RESPONSIVENESS (Applies only to screen view)  */
        /* ---------------------------------------------------- */
        @media screen and (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px;
            }
            .nav-tabs {
                flex-wrap: wrap;
            }
            .tab-btn {
                flex: 1 1 45%;
                text-align: center;
                padding: 12px 8px;
                font-size: 13px;
            }
            .shop-header {
                flex-direction: column-reverse;
                text-align: center;
                gap: 15px;
            }
            .header-logo {
                margin: 0 auto;
            }
            .details-grid {
                grid-template-columns: 1fr;
            }
            .search-select-section {
                flex-direction: column;
                align-items: stretch;
            }
            .search-select-section input {
                width: 100%;
                box-sizing: border-box;
            }
            .catalog-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .catalog-toolbar div {
                display: flex;
                flex-direction: column;
                gap: 8px;
                width: 100%;
            }
            .btn {
                padding: 12px 14px;
                width: 100%;
                font-size: 14px;
                box-sizing: border-box;
            }
            .json-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .file-label {
                justify-content: center;
                width: 100%;
                box-sizing: border-box;
            }
            
            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
                width: 100%;
                -webkit-overflow-scrolling: touch;
            }
            .item-cell {
                gap: 10px;
            }
            .item-cell input {
                min-width: 180px; 
            }
            td input {
                min-width: 60px; 
            }
            .actions {
                justify-content: center;
                width: 100%;
            }
        }

        /* PDF Printing Styles */
        @page {
            margin: 8mm;
        }

        @media print {
            html, body {
                margin: 0;
                padding: 0;
                height: auto;
            }
            
            body { 
                background: none; 
            }

            .print-border {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: 2px solid var(--primary);
                opacity: 0.5;
                box-sizing: border-box;
                pointer-events: none;
                z-index: 1000;
            }

            .container { 
                box-shadow: none; 
                border: none;
                border-radius: 0;
                padding: 10mm !important;
                width: 100%; 
                max-width: 100%;
                height: auto;
                overflow: visible;
                box-sizing: border-box; 
            }

            .nav-tabs, .search-select-section, .no-print, .btn-delete { 
                display: none !important; 
            }
            input { 
                border: none !important; 
                background: transparent !important; 
                padding: 0 !important; 
            }
            input[type="date"]::-webkit-calendar-picker-indicator {
                display: none !important;
                opacity: 0 !important;
                visibility: hidden !important;
                width: 0 !important;
                height: 0 !important;
                position: absolute !important;
                pointer-events: none !important;
            }
            .no-print-date {
                display: none !important;
            }
            .print-date-text {
                display: block !important;
                font-size: 14px;
                color: #334155;
                padding: 0 !important;
                margin: 0 !important;
                line-height: 1.4;
            }

            .table-thumb {
                object-fit: contain !important;
            }

            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
        }

        .print-date-text {
            display: none;
        }
    </style>
</head>

    let inventory = defaultInventorySeed.map(item => ({ ...item }));

    const estDateInput = document.getElementById('estDate');
    const estDatePrint = document.getElementById('estDatePrint');
    const jsonFileInput = document.getElementById('jsonFileInput');
    const importStatus = document.getElementById('importStatus');
    const inventorySummary = document.getElementById('inventorySummary');

    function formatDateForPrint(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr + 'T00:00:00');
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}/${month}/${year}`;
    }

    function syncDatePrint() {
        estDatePrint.textContent = formatDateForPrint(estDateInput.value);
    }

    estDateInput.valueAsDate = new Date();
    syncDatePrint();
    estDateInput.addEventListener('change', syncDatePrint);
    estDateInput.addEventListener('input', syncDatePrint);

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if (btn) btn.classList.add('active');
        if (tabId === 'catalogTab') updateCatalogBadges();
        if (tabId === 'jsonTab') updateImportSummary();
    }

    function goToEstimateTab() {
        switchTab('estimateTab', document.getElementById('btnTabEstimate'));
    }

    function goToCatalogTab() {
        // Catalog tab is hidden from menu but still functional via "Show All" button.
        // We temporarily activate it without showing a nav button.
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('catalogTab').classList.add('active');
        updateCatalogBadges();
    }

    /* Core Add to Estimate Function (Handles Deduplication) */
    function addItemToEstimate(itemName, explicitQty = null) {
        const item = inventory.find(i => i.name.toLowerCase() === itemName.toLowerCase());
        if (!item) return;

        const addQty = explicitQty !== null ? parseInt(explicitQty) : (parseInt(item.qty) || 1);
        const rows = document.querySelectorAll('#tableBody tr');

        if (rows.length === 1) {
            const nameInput = rows[0].querySelector('.item-name');
            if (nameInput && !nameInput.value.trim()) {
                rows[0].remove();
            }
        }

        let existingRow = null;
        for (let row of document.querySelectorAll('#tableBody tr')) {
            const nameInput = row.querySelector('.item-name');
            if (nameInput && nameInput.value.trim().toLowerCase() === item.name.toLowerCase()) {
                existingRow = row;
                break;
            }
        }

        if (existingRow) {
            const qtyInput = existingRow.querySelector('.item-qty');
            const currentQty = parseInt(qtyInput.value) || 0;
            qtyInput.value = currentQty + addQty;
            existingRow.style.backgroundColor = '#ecfdf5';
            setTimeout(() => existingRow.style.backgroundColor = '', 300);
        } else {
            addRow(item.name, addQty, item.brand, item.img);
        }

        updateCatalogBadges();
    }

    function removeItemFromEstimate(itemName) {
        const rows = document.querySelectorAll('#tableBody tr');
        let removed = false;

        for (let row of rows) {
            const nameInput = row.querySelector('.item-name');
            if (nameInput && nameInput.value.trim().toLowerCase() === itemName.toLowerCase()) {
                row.remove();
                removed = true;
                break;
            }
        }

        if (removed) {
            updateIndexes();
            updateCatalogBadges();
        } else {
            alert(`"${itemName}" is not currently in the estimate.`);
        }
    }

    function getItemQtyInEstimate(itemName) {
        const rows = document.querySelectorAll('#tableBody tr');
        for (let row of rows) {
            const nameInput = row.querySelector('.item-name');
            if (nameInput && nameInput.value.trim().toLowerCase() === itemName.toLowerCase()) {
                const qtyInput = row.querySelector('.item-qty');
                return parseInt(qtyInput.value) || 0;
            }
        }
        return 0;
    }

    function updateCatalogBadges() {
        document.querySelectorAll('.badge-in-est').forEach(badge => {
            const itemName = badge.getAttribute('data-item-name');
            const qty = getItemQtyInEstimate(itemName);
            if (qty > 0) {
                badge.textContent = `In Estimate: ${qty}`;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        });
    }

    function createNewEstimate() {
        const confirmNew = confirm("Start a brand new estimate? This will clear all items in the current estimate table.");
        if (!confirmNew) return;

        document.getElementById('tableBody').innerHTML = '';
        addNewRow();

        const estNoInput = document.getElementById('estNo');
        const match = estNoInput.value.match(/^(.*?)(\d+)$/);
        if (match) {
            const prefix = match[1];
            const nextNum = parseInt(match[2], 10) + 1;
            estNoInput.value = prefix + String(nextNum).padStart(match[2].length, '0');
        }

        document.getElementById('custName').value = '';
        document.getElementById('custPhone').value = '';
        estDateInput.valueAsDate = new Date();
        syncDatePrint();

        updateCatalogBadges();
        alert(`New estimate (${estNoInput.value}) initialized! Select items from the list below.`);
    }

    function handleDropdownSelect(value) {
        addItemToEstimate(value);
        document.getElementById('itemSearchInput').value = '';
        document.getElementById('searchDropdown').classList.remove('show');
    }

    function handleInlineSelect(input) {
        const val = input.value;
        const selectedItem = inventory.find(item => item.name.toLowerCase() === val.toLowerCase());
        
        if (selectedItem) {
            const row = input.closest('tr');
            row.querySelector('.table-thumb').src = selectedItem.img;
            row.querySelector('.item-qty').value = selectedItem.qty;
            row.querySelector('.item-brand').value = selectedItem.brand || '';
            updateCatalogBadges();
        }
    }

    function renderCatalogTable() {
        const tbody = document.getElementById('catalogTableBody');
        tbody.innerHTML = '';

        inventory.forEach(item => {
            const row = document.createElement('tr');
            
            row.innerHTML = `
                <td><img src="${item.img}" class="table-thumb" onerror="this.src='${defaultPlaceholder}'"></td>
                <td>
                    <strong>${item.name}</strong>
                    <div><span class="badge-in-est" data-item-name="${item.name}" style="display:none;"></span></div>
                </td>
                <td>${item.qty}</td>
                <td>${item.brand || '—'}</td>
                <td class="no-print">
                    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                        <button class="btn btn-add btn-item-add" style="padding: 6px 12px; font-size: 13px;">+ Add</button>
                        <button class="btn btn-delete btn-item-del" style="padding: 6px 12px; font-size: 13px;">Delete</button>
                    </div>
                </td>
            `;

            row.querySelector('.btn-item-add').addEventListener('click', () => addItemToEstimate(item.name));
            row.querySelector('.btn-item-del').addEventListener('click', () => removeItemFromEstimate(item.name));

            tbody.appendChild(row);
        });

        updateCatalogBadges();
    }

    function addRow(name = '', qty = 1, brand = '', imgUrl = defaultPlaceholder) {
        const tbody = document.getElementById('tableBody');
        const row = document.createElement('tr');

        row.innerHTML = `
            <td class="row-index"></td>
            <td>
                <div class="item-cell">
                    <img src="${imgUrl}" class="table-thumb" onerror="this.src='${defaultPlaceholder}'">
                    <input type="text" value="${name}" class="item-name" placeholder="Type or select item..." onchange="handleInlineSelect(this)">
                </div>
            </td>
            <td><input type="text" value="${qty}" class="item-qty" oninput="updateCatalogBadges()"></td>
            <td><input type="text" value="${brand}" class="item-brand"></td>
            <td class="no-print"><button class="btn-delete" onclick="removeRow(this)">X</button></td>
        `;

        tbody.appendChild(row);
        updateIndexes();
        updateCatalogBadges();
    }

    function addNewRow() {
        addRow('', 1, '', defaultPlaceholder);
    }

    function removeRow(btn) {
        btn.closest('tr').remove();
        updateIndexes();
        updateCatalogBadges();
    }

    function updateIndexes() {
        document.querySelectorAll('#tableBody tr').forEach((row, index) => {
            row.querySelector('.row-index').textContent = index + 1;
        });
    }

    function setupSearchDropdown() {
        const searchInput = document.getElementById('itemSearchInput');
        const dropdown = document.getElementById('searchDropdown');
        
        searchInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            
            if (!query) {
                dropdown.classList.remove('show');
                return;
            }
            
            const matches = inventory.filter(item => 
                item.name.toLowerCase().includes(query)
            );
            
            if (matches.length === 0) {
                dropdown.innerHTML = '<div class="no-results">No items found</div>';
                dropdown.classList.add('show');
                return;
            }
            
            dropdown.innerHTML = matches.map(item => `
                <div class="search-dropdown-item" data-item='${JSON.stringify(item)}'>
                    <img src="${item.img}" alt="${item.name}" onerror="this.src='${defaultPlaceholder}'">
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-details">Qty: ${item.qty} | Brand: ${item.brand || 'N/A'}</span>
                    </div>
                </div>
            `).join('');
            
            dropdown.classList.add('show');
            
            dropdown.querySelectorAll('.search-dropdown-item').forEach(el => {
                el.addEventListener('click', function() {
                    const item = JSON.parse(this.dataset.item);
                    handleDropdownSelect(item.name);
                });
            });
        });
        
        searchInput.addEventListener('blur', function() {
            setTimeout(() => {
                dropdown.classList.remove('show');
            }, 200);
        });
        
        searchInput.addEventListener('focus', function() {
            if (this.value.trim()) {
                this.dispatchEvent(new Event('input'));
            }
        });
        
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const firstItem = dropdown.querySelector('.search-dropdown-item');
                if (firstItem) {
                    const item = JSON.parse(firstItem.dataset.item);
                    handleDropdownSelect(item.name);
                }
            } else if (e.key === 'Escape') {
                dropdown.classList.remove('show');
                this.blur();
            }
        });
    }

    // ========== JSON FILE IMPORT ONLY ==========
    function externalJsonToInventory(jsonArray) {
        if (!Array.isArray(jsonArray)) throw new Error("JSON root must be an array");
        return jsonArray.map((entry, index) => {
            const name = entry.item_name || entry.name || `Item ${index + 1}`;
            const brand = entry.brand || "";
            const qty = entry.quantity !== undefined ? entry.quantity : (entry.qty || 1);
            const img = entry.item_image_filename || entry.img || defaultPlaceholder;
            const id = entry.id !== undefined ? entry.id : index + 1;
            return {
                id: id,
                name: name,
                qty: qty,
                brand: brand,
                img: img
            };
        });
    }

    function handleFileImport(event) {
        const file = event.target.files[0];
        if (!file) return;

        // Reset status
        importStatus.className = 'import-status';
        importStatus.textContent = '';
        inventorySummary.textContent = '';

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const content = e.target.result;
                const parsed = JSON.parse(content);
                const newInventory = externalJsonToInventory(parsed);
                inventory = newInventory;

                // Re-render catalog
                renderCatalogTable();
                updateCatalogBadges();

                // Show success
                importStatus.className = 'import-status success';
                importStatus.textContent = `✅ Successfully imported ${newInventory.length} items from "${file.name}".`;

                // Update summary
                const totalQty = newInventory.reduce((sum, i) => sum + (parseInt(i.qty) || 0), 0);
                inventorySummary.innerHTML = `📦 <strong>${newInventory.length}</strong> unique items · Total default quantity: <strong>${totalQty}</strong>`;

                // Reset search input to avoid stale results
                document.getElementById('itemSearchInput').value = '';
                document.getElementById('searchDropdown').classList.remove('show');

            } catch (err) {
                importStatus.className = 'import-status error';
                importStatus.textContent = `❌ Failed to parse "${file.name}": ${err.message}`;
            } finally {
                jsonFileInput.value = '';
            }
        };
        reader.readAsText(file);
    }

    function updateImportSummary() {
        // Show current inventory summary if no status is displayed
        if (!importStatus.textContent) {
            const totalQty = inventory.reduce((sum, i) => sum + (parseInt(i.qty) || 0), 0);
            inventorySummary.innerHTML = `Current inventory: <strong>${inventory.length}</strong> items · Total default quantity: <strong>${totalQty}</strong>`;
        }
    }

    // Initialize
    renderCatalogTable();
    addNewRow();
    setupSearchDropdown();

    window.addEventListener('DOMContentLoaded', () => {
        updateImportSummary();
    });

    jsonFileInput.addEventListener('change', handleFileImport);

    // Expose functions to global
    window.switchTab = switchTab;
    window.goToEstimateTab = goToEstimateTab;
    window.goToCatalogTab = goToCatalogTab;
    window.addNewRow = addNewRow;
    window.removeRow = removeRow;
    window.handleInlineSelect = handleInlineSelect;
    window.createNewEstimate = createNewEstimate;
    window.updateCatalogBadges = updateCatalogBadges;
</script>
